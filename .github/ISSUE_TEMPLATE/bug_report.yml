name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Remove secrets such as `API_KEY`, `CONFIG_PASSWORD`, or `cf_clearance` from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the server with `bun run dev`
        2. Request `GET /api/...`
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - REST API (/api/*)
        - MCP server (stdio)
        - MCP server (HTTP /mcp)
        - Web UI
        - Docker / deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, with `DEBUG=true` if possible.
      render: text
